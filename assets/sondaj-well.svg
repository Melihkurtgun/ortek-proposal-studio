  <!-- Zarif Çapraz Gölge Efekti -->
  <path d="M0 40 Q 50 55 100 75 L 100 100 L 0 100 Z" fill="rgba(0, 0, 0, 0.12)"/>

  <!-- Su Kuyusu Çizimi (Beyaz İkon) -->
  <g fill="#ffffff" filter="url(#wellShadow)">
    <!-- Sol Direk -->
    <rect x="34" y="21" width="4.5" height="34" rx="2.25"/>
    
    <!-- Sağ Direk -->
    <rect x="65.5" y="21" width="4.5" height="34" rx="2.25"/>

    <!-- Üst Makara / Kütük -->
