    <path d="M34 26.5 L28 26.5 A 2 2 0 0 0 26 28.5 L26 35.5 A 2 2 0 0 1 24 37.5 L22.5 37.5 A 1.5 1.5 0 0 0 21 39 L21 40 A 1.5 1.5 0 0 0 22.5 41.5 L24 41.5 A 5 5 0 0 0 29 36.5 L29 29.5 L34 29.5 Z"/>

    <!-- Kuyu Alt Gövdesi (Tuğla Desenli Duvar) -->
    <!-- Dış Gövde -->
    <rect x="29" y="50" width="46" height="30" rx="7"/>
  </g>

  <!-- Tuğla Derzleri (Mavi Boşluklar) -->
  <g fill="#0077b6">
