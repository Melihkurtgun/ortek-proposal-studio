    <rect x="34" y="59" width="36" height="2.2" rx="0.5"/>
    <!-- Yatay Derz 2 -->
    <rect x="34" y="69" width="36" height="2.2" rx="0.5"/>

    <!-- 1. Sıra Dikey Derzler -->
    <rect x="44.5" y="52" width="2.2" height="7" rx="0.5"/>
    <rect x="57.5" y="52" width="2.2" height="7" rx="0.5"/>

    <!-- 2. Sıra Dikey Derzler -->
    <rect x="38" y="61.2" width="2.2" height="7.8" rx="0.5"/>
    <rect x="51" y="61.2" width="2.2" height="7.8" rx="0.5"/>
    <rect x="64" y="61.2" width="2.2" height="7.8" rx="0.5"/>

    <!-- 3. Sıra Dikey Derzler -->
    <rect x="44.5" y="71.2" width="2.2" height="6.8" rx="0.5"/>
    <rect x="57.5" y="71.2" width="2.2" height="6.8" rx="0.5"/>
