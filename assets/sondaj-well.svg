    <!-- Kova İpi -->
    <rect x="51" y="30.5" width="2" height="5"/>

    <!-- Kova Sapı & Kova -->
    <path d="M46 36.5 C46 32.5 58 32.5 58 36.5 L56 49 C55.8 50.5 54.5 51.5 53 51.5 L51 51.5 C49.5 51.5 48.2 50.5 48 49 Z"/>

